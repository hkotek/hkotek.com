---
layout: default
---

<h1 class="blog-title">Posts tagged: {{ page.tag }}</h1>

<ul class="post-list">
  {% assign tag_posts = site.tags[page.tag] | sort: 'date' %}
  {% for post in tag_posts %}
    <li>
      <a class="post-link" href="{{ post.url | prepend: site.baseurl }}">
        {{ post.title }}
      </a>
      <div class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</div>
    </li>
  {% endfor %}
</ul>
