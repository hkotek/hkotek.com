---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>
  <span class="post-meta">{{ page.date | date: "%b %-d, %Y" }}</span>

  {{ content }}

  {% if page.tags %}
    <div class="post-tags">
      <strong>Tags:</strong>
      {% for tag in page.tags %}
        <a href="{{ site.baseurl }}/tags/{{ tag | slugify }}/">{{ tag }}</a>{% if forloop.last == false %}, {% endif %}
      {% endfor %}
    </div>
  {% endif %}
</article>
