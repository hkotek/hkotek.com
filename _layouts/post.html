---
layout: default
---

<article class="post">

  <!-- Post title (also rendered by default layout h1) -->
  <h2 class="post-title">{{ page.title }}</h1>

  <!-- Post date -->
  <div class="post-meta">{{ page.date | date: "%b %-d, %Y" }}</div>

  <!-- Post content -->
  <div class="post-content">
    {{ content }}
  </div>

  <!-- Post tags -->
  {% if page.tags %}
    <div class="post-tags">
      <strong>Tags:</strong>
      {% for tag in page.tags %}
        <a href="{{ site.baseurl }}/tags/{{ tag | slugify }}/">{{ tag }}</a>{% if forloop.last == false %}, {% endif %}
      {% endfor %}
    </div>
  {% endif %}

</article>
