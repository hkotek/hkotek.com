---
layout: default
---

<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>

  <div class="post-meta">{{ page.date | date: "%b %-d, %Y" }}</div>

  <div class="post-content">
    {{ content }}
  </div>

  {% if page.tags %}
    <div class="post-tags">
      <strong>Tags:</strong>
      {% for tag in page.tags %}
        <a href="{{ site.baseurl }}/tags/{{ tag | slugify }}/">{{ tag }}</a>{% if forloop.last == false %}, {% endif %}
      {% endfor %}
    </div>
  {% endif %}
</article>
